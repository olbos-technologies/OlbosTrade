<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olbos</title>
    <!-- .ico first for old browsers, then the SVG: anything that understands
         image/svg+xml prefers it and gets a crisp mark at any zoom or DPI.
         The PNGs stay as the fallback rung between them. The favicon trio
         (.ico, .svg, both PNGs) are one drawing — public/favicon.svg,
         rasterised from it rather than redrawn.

         apple-touch-icon is DELIBERATELY a different mark: the pearl-and-gold
         O. It renders at 180px on an iOS home screen, which is the only place
         in this product a logo is drawn large enough for that detail to exist
         at all — below ~48px its pearl body and gold ribbons disappear and it
         reads as a pale ring, which is why it is not the favicon and not in
         the header lockups. Do not "fix" the inconsistency by regenerating it
         from favicon.svg; test_favicon_assets.py pins the divergence. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
