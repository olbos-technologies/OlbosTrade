<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Olbos">
  <!-- The interlocking loop from the OB mark, redrawn as a single stroked path.
       The full mark cannot serve as a favicon: it is 2.27:1, and a square crop
       of it loses the B and reads as "a", then as a dot. This keeps the motif
       and survives 16px because it is one continuous shape rather than
       letterforms competing for pixels.

       The larger left lobe is deliberate — it echoes the big loop and smaller
       B of the full mark rather than being a symmetric infinity sign.

       translate(-6.6 0) centres the INKED bounds, stroke included. The raw path
       sits 6.6 units right of centre; measured in a browser via getBBox plus
       stroke-width, not eyeballed. -->
  <rect width="64" height="64" rx="13" fill="#101a2e"/>
  <g transform="translate(-6.6 0)">
    <path d="M20 32c0-6 4.4-10 9.4-10 5.6 0 8.8 4.4 12.2 9 3 4 5.6 7.4 9.6 7.4 3.4 0 6-2.7 6-6.4s-2.6-6.4-6-6.4c-4 0-6.6 3.4-9.6 7.4-3.4 4.6-6.6 9-12.2 9C24.4 42 20 38 20 32Z"
          fill="none" stroke="#D4AF37" stroke-width="5.4" stroke-linecap="round"/>
  </g>
</svg>
