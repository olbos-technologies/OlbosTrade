name: CI

on:
  # `branches: ["**"]` plus `pull_request` meant every push to a branch with an
  # open PR started TWO full runs of this workflow. They tested the identical
  # commit, doubled runner minutes, and made CI reports ambiguous about which
  # run was being quoted. They also pulled the postgres service image twice per
  # push, which is what exhausted Docker Hub's anonymous quota and failed
  # backend-tests with `toomanyrequests` on PR #102.
  #
  # Keeping `pull_request` preserves the required checks a PR is gated on, and
  # keeping `push` on main preserves main-branch validation after a merge.
  # A branch with no PR open no longer runs CI on push — open the PR (a draft
  # is enough) to get checks.
  push:
    branches: [main]
  pull_request:

# Supersede, rather than race, when new commits land on the same PR. An older
# run tests a commit nobody is waiting on any more.
#
# cancel-in-progress is conditional, NOT a bare `true`: main must never have a
# validation run cancelled out from under it. On a pull_request event
# github.ref is `refs/pull/N/merge`, so this is true there and false for the
# push-to-main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real PostgreSQL, because some defects are properties of transaction
    # isolation and a mocked session cannot decide a race. Without this the
    # concurrency tests skip, and a skipped test is a green tick that proves
    # nothing — which is how the double-approval bug survived a passing suite.
    services:
      postgres:
        # ECR Public's mirror of the official image, pinned by digest, because
        # anonymous pulls from Docker Hub are rate-limited per IP and shared
        # runners exhaust that quota. PR #102 lost a backend-tests run to
        # `toomanyrequests` three retries deep, before any test executed.
        #
        # VERIFIED, not assumed: the mirror's manifest is byte-for-byte the
        # official one. Both registries return the same index digest, which also
        # matches Docker Hub's own docker-content-digest header for postgres:16:
        #
        #   docker/library/postgres:16  (ECR Public) -> sha256:ca0bd484...b641d
        #   library/postgres:16         (Docker Hub) -> sha256:ca0bd484...b641d
        #
        # Re-verify, or find the digest for a newer tag, with:
        #
        #   T=$(curl -s https://public.ecr.aws/token/ | jq -r .token)
        #   curl -s -H "Authorization: Bearer $T" \
        #     -H 'Accept: application/vnd.oci.image.index.v1+json' \
        #     https://public.ecr.aws/v2/docker/library/postgres/manifests/16 \
        #     | sha256sum
        #
        # Pinned by digest rather than tag so the mirror is content-addressed:
        # a digest cannot drift, which is what makes "verified" stay true. Bump
        # it deliberately when the test database should move.
        #
        # NO CREDENTIALS ARE NEEDED OR STORED. The authenticated-Docker-Hub
        # alternative would be a `credentials:` block reading repository
        # secrets — never literals in this file — and is deliberately not used
        # here, because it would require secrets to exist before CI could run
        # at all.
        image: public.ecr.aws/docker/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olbos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OLBOS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/olbos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: New/critical modules — hard 95% gate
        run: >
          pytest tests/test_trade_frequency_controller.py tests/test_symphony.py
          tests/test_options_intelligence.py tests/test_performance_analytics.py
          tests/test_portfolio_engine.py tests/test_portfolio_correlation.py
          tests/test_strategy_health.py
          tests/test_volatility_sizing.py tests/test_observability.py
          tests/test_research_lab.py tests/test_feature_store.py
          tests/test_strategy_registry.py tests/test_meta_strategy.py
          tests/test_allocation_engine.py tests/test_scenario_engine.py
          tests/test_portfolio_risk_sim.py tests/test_journal_intelligence.py
          tests/test_llm_provider.py tests/test_account_guard.py
          tests/test_live_tenure_guard.py
          tests/test_margin_monitor.py tests/test_unusual_activity.py
          tests/test_income_screener.py tests/test_flow_recommender.py
          tests/test_options_decision_engine.py
          tests/test_kill_switch.py tests/test_kill_switch_engage.py
          tests/test_guardrails.py tests/test_risk_manager.py
          tests/test_position_reconciler.py
          --cov=app.services.options_decision_engine
          --cov=app.services.kill_switch
          --cov=app.services.guardrails
          --cov=app.services.risk_manager
          --cov=app.services.position_reconciler
          --cov=app.services.account_guard
          --cov=app.services.live_tenure_guard
          --cov=app.services.margin_monitor
          --cov=app.services.unusual_activity
          --cov=app.services.income_screener
          --cov=app.services.flow_recommender
          --cov=app.services.trade_frequency_controller
          --cov=app.services.meta_strategy
          --cov=app.services.allocation_engine
          --cov=app.services.scenario_engine
          --cov=app.services.portfolio_risk_sim
          --cov=app.services.journal_intelligence
          --cov=app.services.llm_provider
          --cov=app.services.symphony
          --cov=app.services.options_intelligence
          --cov=app.services.performance_analytics
          --cov=app.services.portfolio_engine
          --cov=app.services.strategy_health
          --cov=app.services.volatility_sizing
          --cov=app.services.observability
          --cov=app.services.research_lab
          --cov=app.services.feature_store
          --cov=app.services.strategy_registry
          --cov-report=term-missing --cov-fail-under=95
      - name: PostgreSQL-backed tests must RUN, not skip
        # These skip silently when OLBOS_TEST_DATABASE_URL is not reaching
        # them, and a skipped test is a green tick that proves nothing — which
        # is how the defects they cover survived a passing suite. Fail the job
        # if any of them skip, and report passed and skipped separately rather
        # than as one number.
        #
        # Counts come from the JUnit XML rather than pytest's summary line,
        # and BOTH are checked against pytest's exit status.
        #
        # Why not the summary line: pyproject's `addopts` is already `-q`, so
        # passing `-q` here too made it `-qq`, and double-quiet suppresses the
        # summary entirely. The grep for it therefore found nothing even on a
        # fully passing run — which failed this step, and worse, made the skip
        # check vacuous, since an all-skipped run prints no summary either.
        # (An earlier version of this comment blamed pending-coroutine
        # teardown noise. That was wrong: the control case reproduces with no
        # async teardown at all. The leaked tasks were real and are now reaped
        # in tests/conftest.py, but they were not this.)
        #
        # The XML is a structured artifact and cannot be quietened away, but it
        # is also not sufficient on its own: an internal error, a crashed
        # interpreter or a plugin failure can leave a clean-looking report. So
        # pytest's own exit code is kept and must agree. Either one saying
        # "bad" fails the step.
        run: |
          set +e
          pytest --no-header -rs --junitxml=pg-tests.xml \
            tests/test_position_claim_pg.py \
            tests/test_trade_desk_claim_route.py \
            tests/test_claim_reconciliation_pg.py \
            tests/test_admin_claims_routes.py \
            tests/test_update_script_deploys_in_order.py \
            tests/test_approval_concurrency_pg.py \
            tests/test_journal_isolation_pg.py
          rc=$?
          set -e
          echo "pytest exit status: $rc"
          PYTEST_RC="$rc" python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          rc = int(os.environ["PYTEST_RC"])
          report = Path("pg-tests.xml")
          if not report.exists():
              sys.exit(f"::error::pytest wrote no JUnit report (exit {rc}) — it never ran.")

          root = ET.parse(report).getroot()
          tests = failures = errors = skipped = 0
          for suite in root.iter("testsuite"):
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))

          print("--- PostgreSQL-backed test outcome ---")
          print(f"pytest_exit={rc}")
          print(f"collected={tests}")
          print(f"passed={tests - failures - errors - skipped}")
          print(f"failed={failures}")
          print(f"errors={errors}")
          print(f"skipped={skipped}")

          if tests == 0:
              sys.exit("::error::No PostgreSQL-backed tests were collected.")
          if skipped:
              print("::error::PostgreSQL-backed tests skipped — the database is "
                    "not reaching them.")
              for case in root.iter("testcase"):
                  if case.find("skipped") is not None:
                      print(f"  SKIPPED {case.get('classname')}::{case.get('name')}")
              sys.exit(1)
          if failures or errors:
              sys.exit(f"::error::PostgreSQL-backed tests failed: "
                       f"{failures} failed, {errors} errors.")
          if rc != 0:
              # A clean report and a non-zero exit means something outside the
              # tests themselves went wrong — an internal error, a plugin, a
              # crash during teardown. Do not pass the step on the report alone.
              sys.exit(f"::error::Report looks clean but pytest exited {rc}.")
          PY

      - name: Whole-app coverage (ratchet floor; target 95%)
        # Also the end-to-end check that no test leaks asyncio tasks. The
        # coordinator is a module-level singleton whose submit() spawns worker
        # tasks on the calling test's loop; nothing stopped them, so a full run
        # printed 54 "Task was destroyed but it is pending!" lines. They are
        # reaped by an autouse fixture now (tests/conftest.py), and a leak is
        # not a test failure, so without this gate it would come back unnoticed.
        run: |
          set -o pipefail
          pytest --cov=app --cov-report=term-missing 2>&1 | tee app-tests.log
          if grep -q "Task was destroyed but it is pending" app-tests.log; then
            echo "::error::A test leaked pending asyncio tasks."
            grep -c "Task was destroyed but it is pending" app-tests.log
            exit 1
          fi
      - name: Dependency vulnerability scan (informational)
        # Non-blocking: CVE disclosures land on a schedule unrelated to any
        # commit here, so failing the build on one would block unrelated
        # pushes. Surface it in the log instead of gating on it.
        run: pip install pip-audit && pip-audit -r requirements.txt || true

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Dependency vulnerability scan (informational)
        run: npm audit --audit-level=high || true

  # Browser tests, for the things jsdom structurally cannot see.
  #
  # vitest runs under jsdom, which does NO layout: every element measures 0x0
  # and scrollWidth is always 0. Two real defects in this repo lived in exactly
  # that blind spot — a nav row that overflowed a 360px phone viewport, and a
  # mobile nav overlay clipped out of existence by an ancestor's overflow rule.
  # Neither was visible to a unit test, a type-check, or a linter.
  #
  # Kept as its own job rather than bolted onto frontend-tests so a browser
  # failure is legible at a glance and the fast unit feedback is not held up
  # behind a browser download.
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are ~150MB and change only when the pin moves, so key
      # the cache on the resolved version rather than the lockfile hash.
      - name: Cache browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache restores the browser but not the apt packages it links
      # against, which live outside the cached path. Skipping this on a cache
      # hit makes the browser fail to start with a missing shared library.
      - name: Install system dependencies (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts builds the app and serves it with `vite preview`,
      # so this runs against the production bundle rather than the dev server.
      - name: Browser tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
