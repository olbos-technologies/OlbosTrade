# OlbosTrade — Nginx server block
# Domain: set by hetzner_setup.sh (replaces OLBOS_DOMAIN placeholder)

upstream olbos_backend {
    server olbos_backend:8000;
    keepalive 32;
}

upstream olbos_frontend {
    server olbos_frontend:5173;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name OLBOS_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name OLBOS_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/OLBOS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/OLBOS_DOMAIN/privkey.pem;
    ssl_session_cache   shared:OLBOS_SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;

    # ── WebSocket (options flow live feed) ───────────────────────────────────
    location /ws/ {
        proxy_pass         http://olbos_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── API → FastAPI backend ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=olbos_api burst=20 nodelay;

        proxy_pass         http://olbos_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://olbos_backend/health;
        access_log off;
    }

    location /docs    { proxy_pass http://olbos_backend/docs; }
    location /redoc   { proxy_pass http://olbos_backend/redoc; }
    location /openapi.json { proxy_pass http://olbos_backend/openapi.json; }

    # ── React frontend ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://olbos_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;

        # Vite's HASHED output only — the filename changes every build, so a
        # copy cached forever can never be the wrong one. ^~ so this wins over
        # the regex below regardless of their order.
        location ^~ /assets/ {
            proxy_pass http://olbos_frontend;
            expires    1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Files copied verbatim out of public/ — favicons and the hero image.
        # They keep the SAME NAME across builds, so `immutable` pins whatever
        # was cached first and replacing the image changes nothing for anyone
        # who already loaded it. Same defect as the frontend entrypoint had;
        # this is the second production path that mounts a config with it.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://olbos_frontend;
            expires    1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
