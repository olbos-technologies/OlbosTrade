# ═══════════════════════════════════════════════════════════════════════════════
# OlbosTrade — Hetzner production stack
#
# Runs ALONGSIDE the existing olbos app on the same server.
# Caddy (already running in olbos) handles HTTPS for both apps.
# OlbosTrade joins the olbos Docker network so Caddy can reach it.
#
# Usage — on the server inside /opt/olbostrade:
#   bash deploy/hetzner/up.sh
#
# NOTE on the DB service: the database itself was renamed live to
# `olbostrade` (ALTER DATABASE — instant, no data copy needed). The Postgres
# ROLE deliberately stays `olbosquant`: renaming a role requires connecting
# as a DIFFERENT superuser (Postgres refuses to let a session rename its own
# login role), which means creating a temporary superuser on production —
# a real privilege-escalation step for a value that is never visible outside
# this file (not in the UI, not in any API response, just an internal
# Postgres credential). Not worth the risk for a cosmetic-only rename. If a
# future deploy legitimately needs the role renamed too, see the Migration
# section in deploy/hetzner/README.md.
# The actual on-disk data volume was created previously and is pinned by
# name to the existing volume. To avoid accidental data loss the Compose
# volume is still mapped to the original external volume name (see
# `volumes:` below).
#
# IMPORTANT — the pgdata volume is pinned with `external: true` + an explicit
# `name:` below, pointing at the volume Compose actually created back when
# this directory was named /opt/olbostrade (Compose prefixes unpinned volume
# names with a project name derived from the directory, so renaming the
# directory silently produces a DIFFERENT, empty volume unless pinned like
# this). `external: true` also makes `docker compose up` fail loudly if that
# volume doesn't exist, instead of silently creating a fresh empty one.
# ═══════════════════════════════════════════════════════════════════════════════

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olbostrade-backend
    restart: unless-stopped
    # NO --proxy-headers here, deliberately, and that is the fix rather than
    # an omission. uvicorn's ProxyHeadersMiddleware decides whether to believe
    # X-Forwarded-For by PEER ADDRESS, and this service joins olbos_default
    # (the shared external docker_default network) because that is where
    # IBKR_HOST=ibkr-gateway resolves. Peer address therefore cannot separate
    # the frontend from Caddy, the gateway, or anything else on that network,
    # so the only workable setting was --forwarded-allow-ips=*: every
    # container there could name its own IP and duck its own rate limit. A
    # CIDR was not an alternative — uvicorn 0.29 matches trusted hosts by
    # exact string, so a subnet silently matches nothing.
    #
    # The trust decision moved into the application, where it can be made on
    # PROVENANCE instead: the frontend sets X-Olbos-Proxy-Secret alongside the
    # X-Forwarded-For it overwrites, and rate_limit.client_ip() believes the
    # header only when that secret matches. Network layout stops mattering.
    # Issue #60.
    #
    # Required, not defaulted: without it the backend ignores X-Forwarded-For
    # and every caller behind the proxy shares one login bucket — ten failed
    # logins lock out everybody. Both services read the same variable.
    env_file:
      - backend/.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://olbosquant:${OLBOSTRADE_DB_PASSWORD}@olbostrade-db:5432/olbostrade
      TRUSTED_PROXY_SECRET: "${TRUSTED_PROXY_SECRET:?set TRUSTED_PROXY_SECRET in backend/.env.prod, generated with openssl rand -hex 32}"
    volumes:
      # Trained models are not committed (see .gitignore) and the build context
      # is ./backend, so nothing puts a .pkl inside the image. Mounting the
      # directory makes the deployment path explicit and survives rebuilds:
      # place a model here on the host, restart, done. Read-only — the app only
      # ever loads from it; training writes here directly on the host.
      - ./backend/ml/model_registry:/app/ml/model_registry:ro
    depends_on:
      olbostrade-db:
        condition: service_healthy
    networks:
      - olbostrade_internal
      - olbos_default        # joins existing Caddy network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/guardrails/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # 1500M killed this container five times between 2026-09-14 and
          # 2026-09-17, unnoticed, because `restart: unless-stopped` brought it
          # back each time:
          #
          #   Memory cgroup out of memory: Killed process ... (uvicorn)
          #   anon-rss:1530596kB   constraint=CONSTRAINT_MEMCG
          #
          # CONSTRAINT_MEMCG, not the host: the machine is a CX33 with 7771M
          # and had gigabytes free through every one of those kills. The
          # container was strangled by its own cap while the box sat idle.
          #
          # This is headroom, NOT a diagnosis. At rest the backend sits around
          # 322M, so something grows it ~1.2G and we do not yet know whether
          # that is a leak or one heavy job — in one case it went from a
          # restart to dead in two minutes. Install the sampler to find out:
          #
          #     bash deploy/hetzner/install_mem_sampler.sh
          #
          # It is NOT installed by this file or by update.sh — it is a host
          # cron, same as install_backup_cron.sh. Until someone runs it there
          # is no memory history, and this cap is a guess with headroom rather
          # than a fix. If kills continue at 3000M, the number was never the
          # problem and raising it again will not help.
          #
          # Budget (see tests/test_hetzner_memory_budget.py): this file's
          # limits total 4280M — 4024M plus Caddy's 256M, which moved INTO this
          # file on 2026-09-19 and so is now counted here rather than as a
          # neighbour. ibkr-gateway is the only container left sharing the host
          # from another compose project.
          memory: 3000M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
    container_name: olbostrade-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://olbostrade-backend:8000
      # Set DASH_USER/DASH_PASS in backend/.env.prod to password-protect the whole
      # dashboard + API (HTTP Basic Auth). Leave unset to serve open (NOT advised
      # when exposed by public IP).
      - DASH_USER=${DASH_USER:-}
      - DASH_PASS=${DASH_PASS:-}
      # Caddy's Docker subnet, so nginx can recover the real client IP from the
      # X-Forwarded-For Caddy sets. Unset = trust nobody, which is safe but
      # means every Caddy-routed caller shares one login rate-limit bucket
      # (nginx sees Caddy's address as the peer). Find it with:
      #   docker network inspect docker_default -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # (docker_default is the real network name; olbos_default is only this
      # file's alias for it, and `docker network inspect` does not know it.)
      # Never widen this to a range a real client could originate from.
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-}
      # The same value the backend requires — it is how the backend knows a
      # request came through this proxy and its X-Forwarded-For can be
      # believed. See backend/app/api/rate_limit.py client_ip(), issue #60.
      - "TRUSTED_PROXY_SECRET=${TRUSTED_PROXY_SECRET:?set TRUSTED_PROXY_SECRET in backend/.env.prod, generated with openssl rand -hex 32}"
    # Bound to LOOPBACK, not 0.0.0.0. Caddy reaches this container over the
    # docker_default network, not through the host port, so publishing it
    # publicly buys nothing and costs a plain-HTTP route into the same app —
    # one on which DASH_USER/DASH_PASS credentials travel base64-encoded and
    # the Trade Desk's own 403 message invites an operator to paste SECRET_KEY.
    #
    # Do NOT "fix" this back to "8080:3000" to regain direct IP access, and do
    # not reach for `ufw deny 8080` as the alternative: Docker's DNAT and
    # FORWARD rules are traversed before UFW's, so a published port stays
    # reachable whatever `ufw status` reports. The loopback bind removes the
    # exposure at the listener, which is the only layer that actually holds.
    #
    # Direct access still works, over SSH, from on the host:
    #   ssh -L 8080:localhost:8080 root@<server-ip>   # then http://localhost:8080
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - olbostrade_internal
      - olbos_default        # joins existing Caddy network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  olbostrade-db:
    image: postgres:16-alpine
    container_name: olbostrade-db
    restart: unless-stopped
    environment:
      # POSTGRES_USER only takes effect on a brand-new empty data dir — the
      # real role on the existing volume is `olbosquant` (kept deliberately,
      # see the NOTE at the top of this file). Set to match so a fresh init
      # (e.g. a new environment) and pg_isready below both agree with reality.
      POSTGRES_USER:     olbosquant
      POSTGRES_PASSWORD: ${OLBOSTRADE_DB_PASSWORD:?set OLBOSTRADE_DB_PASSWORD in backend/.env.prod}
      POSTGRES_DB:       olbostrade
    volumes:
      - olbostrade_pgdata:/var/lib/postgresql/data
    networks:
      - olbostrade_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olbosquant -d olbostrade"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Reverse proxy / TLS ─────────────────────────────────────────────────────
  # Adopted from the deleted OlbosTerminal stack on 2026-09-19. It had been the
  # last thing running from that project, so this app's TLS, its ports 80/443
  # and the network it reaches ibkr-gateway over all depended on a compose file
  # for an application that no longer existed — and the obvious cleanup command
  # in that directory (`docker compose down`) would have removed the
  # docker_default network, cutting the broker connection.
  caddy:
    image: caddy:2-alpine
    container_name: olbostrade-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Port 8081 was published by the previous owner and is deliberately NOT
    # carried over. It served the app over plain HTTP on every interface, and
    # its number is the one ARCHITECTURE_AUDIT.md recorded as the production
    # URL — a misattribution that cost an afternoon during the 2026-09-17
    # outage, because the port was real but belonged to a different stack.
    volumes:
      - ./deploy/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro
      - olbostrade_caddy_data:/data
      - olbostrade_caddy_config:/config
    networks:
      - olbos_default        # must reach olbostrade-frontend by container name
    depends_on:
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  olbostrade_pgdata:
    external: true
    name: olbosquant_olbosquant_pgdata   # pinned to the original external volume (see NOTE above)
  olbostrade_archive:
  # The TLS certificates and ACME account live here. Both are pinned to the
  # volumes the previous stack created, exactly as olbostrade_pgdata is above:
  # declaring fresh ones would make Caddy re-issue from Let's Encrypt, and the
  # per-name rate limit is measured in hours. `docker volume ls` shows them as
  # docker_caddy-data / docker_caddy-config — the `docker_` prefix is Compose's
  # project prefix, taken from the old /root/OlbosTerminal/docker directory.
  olbostrade_caddy_data:
    external: true
    name: docker_caddy-data
  olbostrade_caddy_config:
    external: true
    name: docker_caddy-config

networks:
  olbostrade_internal:
    driver: bridge
  olbos_default:
    external: true
    # Kept EXTERNAL deliberately, even though this stack now owns Caddy.
    # ibkr-gateway sits on this network too and belongs to a third compose
    # project, and IBKR_HOST=ibkr-gateway resolves over it — so `docker compose
    # down` here must never take it with them. The name keeps its historical
    # `docker_` prefix because renaming a network means recreating every
    # container attached to it, ibkr-gateway included.
    name: docker_default
